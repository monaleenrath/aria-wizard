# ═══════════════════════════════════════════════════════════════════════════════
# ARIA — Role Profiles (Airways / Lufthansa Dataset)
# ═══════════════════════════════════════════════════════════════════════════════

roles:

  CEO:
    title: "Chief Executive Officer"
    badge: "CEO  ·  EXECUTIVE BRIEFING"
    slack_channel: "C0B5U431C3U"
    tier: "c_suite"
    primary_kpi: "Revenue"
    kpis: ["Revenue", "Profit", "Passengers", "Margin"]
    accent_color: "#F59E0B"
    driver_focus: ["Route", "Region"]
    tone: >
      Strategic and big-picture. The CEO wants to know if the airline is growing
      revenue, if margins are healthy, and where the biggest risk or opportunity is.
      Lead with Revenue, then Profit and Margin. One sharp strategic insight per
      section — route profitability, load factor trends, or fuel cost pressure.
      Frame every data point in terms of network value or competitive positioning.

  CFO:
    title: "Chief Financial Officer"
    badge: "CFO  ·  FINANCIAL BRIEFING"
    slack_channel: "C0B6A6HJLJH"
    tier: "c_suite"
    primary_kpi: "Profit"
    kpis: ["Profit", "Margin", "Revenue", "Fuel Cost"]
    accent_color: "#10B981"
    driver_focus: ["Route", "Region"]
    tone: >
      Numbers-first. The CFO cares about margin health, fuel cost discipline,
      and profitability drivers. Flag any margin compression or fuel cost spikes
      immediately. Lead with Profit and Margin, then contextualise with Revenue.
      One financial risk and one financial opportunity per briefing.

  COO:
    title: "Chief Operating Officer"
    badge: "COO  ·  OPERATIONS BRIEFING"
    slack_channel: ""
    tier: "operations"
    primary_kpi: "Passengers"
    kpis: ["Passengers", "Load Factor", "Avg Delay", "Active Routes"]
    accent_color: "#2DD4BF"
    driver_focus: ["Route", "Origin", "Destination"]
    tone: >
      Efficiency-focused. The COO cares about passenger throughput, load factor,
      on-time performance, and delay management. Surface any route anomalies or
      delay spikes. One operational fix with a clear owner and measurable impact.

  VP:
    title: "Vice President"
    badge: "VP  ·  LEADERSHIP BRIEFING"
    slack_channel: "C0B5S26QBDL"
    tier: "leadership"
    primary_kpi: "Revenue"
    kpis: ["Revenue", "Profit", "Passengers", "Load Factor"]
    accent_color: "#A78BFA"
    driver_focus: ["Route", "Region", "Origin"]
    tone: >
      Balanced cross-functional view. Cover both revenue growth and load factor
      efficiency. Surface any tension between network expansion and margin health.
      Recommend one action spanning at least two functions.

  Sales Head:
    title: "Sales Head"
    badge: "SALES  ·  COMMERCIAL BRIEFING"
    slack_channel: "C0B5XN2Q5TN"
    tier: "commercial"
    primary_kpi: "Revenue"
    kpis: ["Revenue", "Passengers", "Load Factor", "Margin"]
    accent_color: "#60A5FA"
    driver_focus: ["Route", "Destination", "Region"]
    tone: >
      Action-oriented and commercial. Name specific routes and destinations.
      Give one clear commercial move before end of day — yield management action,
      capacity reallocation, or a promotional push on a low-load route.

  Operations Head:
    title: "Operations Head"
    badge: "OPS  ·  OPERATIONS BRIEFING"
    slack_channel: "C0B5VUPPP4Z"
    tier: "operations"
    primary_kpi: "Avg Delay"
    kpis: ["Avg Delay", "Load Factor", "Passengers", "Fuel Cost"]
    accent_color: "#2DD4BF"
    driver_focus: ["Origin", "Destination", "Route"]
    tone: >
      Precision-focused. The Operations Head cares about on-time performance,
      delay causes, fuel burn, and turnaround efficiency. One operational fix with
      clear owner, timeline, and measurable impact on departure punctuality.
