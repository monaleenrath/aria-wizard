# =============================================================
# Board Room Narrator Agent - Configuration
# Airways / Lufthansa Dataset
# =============================================================

data:
  google_sheet_url: ""

  excel_path: "data/Airways_Lufthansa_Data_2023_2024.xlsx"
  sheet_name: "Flights"

  date_column: "Flight Date"

  timezone: "America/Toronto"

  fallback_to_max_date_if_missing: true

metrics:
  kpis:
    - name: "Revenue"
      column: "Revenue (EUR)"
      agg: "sum"
      format: "currency"
    - name: "Profit"
      column: "Profit (EUR)"
      agg: "sum"
      format: "currency"
    - name: "Passengers"
      column: "Passengers"
      agg: "sum"
      format: "integer"
    - name: "Active Routes"
      column: "Route"
      agg: "nunique"
      format: "integer"
    - name: "Load Factor"
      column: "Load Factor%"
      agg: "mean"
      format: "number"
    - name: "Avg Delay"
      column: "Delay (min)"
      agg: "mean"
      format: "number"
    - name: "Fuel Cost"
      column: "Fuel Cost (EUR)"
      agg: "sum"
      format: "currency"
    - name: "Margin"
      column: "Margin%"
      agg: "mean"
      format: "number"

  anomaly_zscore_threshold: 2.0
  anomaly_lookback_days: 90

drivers:
  dimensions:
    - "Route"
    - "Origin"
    - "Destination"
    - "Region"
  top_n: 3

llm:
  provider: "gemini"
  model: "gemini-2.5-flash"
  temperature: 0.4
  max_output_tokens: 8192
  tone: "executive, confident, concise"
  audience: "C-suite and board members"

delivery:
  channels:
    - "slack"
    - "file"

  slack:
    webhook_env_var: "SLACK_WEBHOOK_URL"

  teams:
    webhook_env_var: "TEAMS_WEBHOOK_URL"
    title_prefix: "Daily Performance Briefing"

  file:
    output_dir: "output"
    formats:
      - "markdown"
      - "docx"
